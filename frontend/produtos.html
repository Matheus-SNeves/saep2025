<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button onclick="window.location.href='dashboard.html'">Voltar</button>
        <h1>Cadastro de Produtos</h1>
    </header>
    
    <div class="container">
        <div class="search-box">
            <input type="text" id="busca" placeholder="Buscar produto...">
            <button onclick="buscarProduto()">Buscar</button>
        </div>

        <div class="form-produto">
            <input type="hidden" id="prod-id">
            <input type="text" id="nome" placeholder="Nome">
            <input type="text" id="descricao" placeholder="Descrição">
            <input type="number" id="preco" placeholder="Preço">
            <input type="number" id="estoque" placeholder="Qtd Estoque">
            <input type="number" id="minimo" placeholder="Qtd Mínima">
            <button onclick="salvarProduto()">Salvar</button>
            <button onclick="limparForm()">Cancelar</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Nome</th><th>Preço</th><th>Estoque</th><th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-produtos"></tbody>
        </table>
    </div>
    <script src="script.js"></script>
    <script>carregarProdutos();</script>
</body>
</html>
